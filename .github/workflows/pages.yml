# Builds the web arcade (web/README.md) and publishes web/target/site to GitHub Pages.
# One-time setup in the repo: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one that is under way.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  MAVEN_VERSION: 3.9.9
  SITE_URL: https://nate314.github.io/old-java-applications

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: web/then and web/then-nathanos run git archive on a pinned commit, and web/apps writes
          # What's new (history.txt) from git log.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # web/src (the React pages) and web/public are built with Vite during the Maven build.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Maven ${{ env.MAVEN_VERSION }}
        run: |
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build the site
        run: mvn -B -f web/pom.xml package "-Dsite.url=${SITE_URL}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
