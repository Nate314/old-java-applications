# Serves the built site (web/target/site) in the container (web/Dockerfile).

# An app's program asked for with its build's stamp (classes.js?v=<hash>, web/vite/stamp-programs.mjs) never changes.
map $arg_v $program_cache {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The lost page answers at the missing address itself, which is how its short links (/dino, /flappy/then) work.
    error_page 404 /404.html;

    # Everything is checked with the server on each use (a quick 304 when unchanged), so a page and the files it
    # names always come from the same build. The service worker (sw.js) must not be cached either.
    add_header Cache-Control "no-cache";

    # Text goes gzipped, as GitHub Pages and web/serve.ps1 send it (about a third of its size); text/html is always on.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/plain text/csv application/xml application/wasm;

    # nginx's own list of types lacks the web app manifest, which the browser needs to offer Install app.
    location ~ \.webmanifest$ { default_type application/manifest+json; }

    # Scripts and stylesheets named with a hash of their content (web/vite.config.ts) never change: kept a year.
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location ~ /(classes|then)\.js$ { add_header Cache-Control $program_cache; }
}
