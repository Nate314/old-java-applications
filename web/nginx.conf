# Serves the built site (web/target/site) in the container (web/Dockerfile).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The lost page answers at the missing address itself, which is how its short links (/dino, /flappy/then) work.
    error_page 404 /404.html;

    # nginx's own list of types lacks the web app manifest, which the browser needs to offer Install app.
    location ~ \.webmanifest$ { default_type application/manifest+json; }

    # The service worker must not be cached, so a new build reaches visitors on their next load.
    location = /sw.js { add_header Cache-Control "no-cache"; }
}
