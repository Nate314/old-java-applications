<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The story: Old Java Applications</title>
  <meta name="description" content="How 20 Java Swing and AWT programs written more than ten years ago were recovered from old jars, fixed up and brought to the browser, told with their real code and the apps themselves.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <!--
    The story page: the repo's HISTORY.md told on the site, chapter by chapter, with the things it talks about
    next to the words. The originals (the 2016 quotes StockChecker saved, read from StockChecker/stockCheck.csv),
    the recovery (Flappy Bird's Bird class as decompiled, renamed in place token by token), the first restoration
    (the embeddable player, play.html, on a Then version with a Then | Now switch), the chain (counted from
    history.txt, the git log the build writes for What's new) and the run in numbers (agents-timeline.svg, drawn
    from the session's usage numbers; the numbers in its text are copied from HISTORY.md). It wears the visitor's skin from shim.css, read
    from localStorage like boot.js does, but does not load boot.js (that file is for the home and app pages).
    The facts in the text come from HISTORY.md; keep the two in step. See web/README.md, The story.
  -->
  <link rel="stylesheet" href="shim.css">
  <script>
    (function () {
      var s = 'modern';
      try { s = localStorage.getItem('oldjava.skin') || 'modern'; } catch (e) { /* storage blocked */ }
      // Yours is built by boot.js, which this page does not load: Modern stands in for it here.
      if (['modern', 'classic', 'arcade'].indexOf(s) < 0) s = 'modern';
      document.documentElement.setAttribute('data-skin', s);
    })();
  </script>
  <style>
    body { font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: var(--accent); }
    .story-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap;
                 padding: 8px 16px; background: var(--card-bg); border-bottom: 1px solid var(--card-border); font-size: 14px; }
    .story-top .home { font-weight: 700; text-decoration: none; color: inherit; white-space: nowrap; }
    .story-top nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
    .story-top nav a { padding: 2px 10px; border-radius: 999px; text-decoration: none; color: inherit; opacity: 0.75; white-space: nowrap; }
    .story-top nav a[aria-current="true"] { background: var(--accent); color: #fff; opacity: 1; }
    .story-top .bar { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; background: var(--accent);
                      transform-origin: 0 50%; transform: scaleX(0); }
    main { max-width: 1040px; margin: 0 auto; padding: 0 16px 80px; }
    .hero { padding: 64px 0 24px; }
    .kicker { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
    .hero h1 { margin: 0 0 14px; font-size: clamp(32px, 7vw, 56px); line-height: 1.05; letter-spacing: -0.02em; max-width: 14em; }
    .hero p { margin: 0; max-width: 40em; font-size: 18px; opacity: 0.85; }
    .hero p.inspired { margin-top: 12px; font-size: 15px; }
    .chapters { display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0 0; padding: 0; list-style: none; counter-reset: ch; }
    .chapters a { display: block; padding: 10px 14px; border: 1px solid var(--card-border); border-radius: 10px; background: var(--card-bg);
                  color: inherit; text-decoration: none; font-size: 14px; counter-increment: ch; }
    .chapters a::before { content: counter(ch) "  "; font-weight: 700; color: var(--accent); }
    .chapters a:hover { border-color: var(--accent); }

    section.chapter { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 32px; align-items: start;
                      padding: 56px 0; border-top: 1px solid var(--card-border); scroll-margin-top: 48px; }
    .chapter h2 { margin: 0 0 12px; font-size: clamp(24px, 4vw, 32px); line-height: 1.15; letter-spacing: -0.01em; }
    .chapter .words p, .chapter .words ul { margin: 0 0 14px; }
    .chapter .words ul { padding-left: 20px; }
    .chapter .words li { margin-bottom: 6px; }
    /* The words stay beside what they talk about, on screens tall enough to hold them whole. */
    @media (min-width: 761px) and (min-height: 820px) { .chapter .words { position: sticky; top: 64px; } }
    .chapter .show { min-width: 0; }
    .panel { border: 1px solid var(--card-border); border-radius: 12px; background: var(--card-bg); overflow: hidden;
             box-shadow: 0 14px 36px rgba(15, 23, 42, 0.12); }
    .panel-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 8px 12px; border-bottom: 1px solid var(--card-border);
                  font-size: 13px; }
    .panel-head strong { margin-right: auto; }
    .caption { margin: 10px 2px 0; font-size: 13px; opacity: 0.7; }
    .btn { display: inline-block; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--card-border); background: transparent;
           color: inherit; font: 600 13px/1.5 inherit; font-family: inherit; text-decoration: none; cursor: pointer; white-space: nowrap; }
    .btn[aria-pressed="true"], .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn:focus-visible, .chapters a:focus-visible, .story-top a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* 1. the 2016 quotes */
    .tape { width: 100%; border-collapse: collapse; font: 13px/1.4 ui-monospace, Consolas, monospace; }
    .tape th, .tape td { padding: 5px 12px; text-align: right; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
    .tape th:first-child, .tape td:first-child { text-align: left; }
    .tape th { font: 600 11px/1.4 system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.65; }
    .tape tr.rest td { text-align: left; opacity: 0.55; font-style: italic; }
    .tape .up { color: #15803d; } .tape .down { color: #b91c1c; }
    :root[data-skin="arcade"] .tape .up { color: #4ade80; } :root[data-skin="arcade"] .tape .down { color: #fb7185; }
    .apps20 { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin-top: 16px; }
    .apps20 a { display: flex; flex-direction: column; gap: 4px; padding: 6px; border: 1px solid var(--card-border); border-radius: 8px;
                background: var(--card-bg); color: inherit; text-decoration: none; font-size: 12px; line-height: 1.25; }
    .apps20 a:hover { border-color: var(--accent); }
    .apps20 img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 4px; background: var(--desk); }
    .apps20 .from { opacity: 0.65; }
    .apps20 h3 { grid-column: 1 / -1; margin: 8px 0 0; font-size: 13px; }

    /* 2. the recovery: the decompiled class renamed in place */
    .code { margin: 0; padding: 12px 14px; max-height: 440px; overflow: auto; font: 12.5px/1.55 ui-monospace, Consolas, monospace;
            background: #0f172a; color: #e2e8f0; tab-size: 3; }
    :root[data-skin="classic"] .code { background: #ffffff; color: #1f2937; }
    .code .kw { color: #c084fc; } .code .num { color: #fbbf24; }
    :root[data-skin="classic"] .code .kw { color: #7c2d92; } :root[data-skin="classic"] .code .num { color: #9a3412; }
    .code .id { border-radius: 3px; transition: background-color 0.6s ease; }
    .code .id.old { background: rgba(248, 113, 113, 0.22); color: #fecaca; }
    .code .id.new { background: rgba(74, 222, 128, 0.2); color: #bbf7d0; }
    .code .id.fresh { background: rgba(74, 222, 128, 0.55); }
    :root[data-skin="classic"] .code .id.old { background: #fee2e2; color: #991b1b; }
    :root[data-skin="classic"] .code .id.new { background: #dcfce7; color: #166534; }
    :root[data-skin="classic"] .code .id.fresh { background: #86efac; }
    .count { font-variant-numeric: tabular-nums; opacity: 0.75; }

    /* 3. the restoration: the embeddable player */
    .screen { position: relative; aspect-ratio: 16 / 10; background: var(--desk); }
    .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .era { display: inline-flex; border: 1px solid var(--card-border); border-radius: 999px; overflow: hidden; }
    .era .btn { border: 0; border-radius: 0; }
    select { font: inherit; font-size: 13px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--card-border);
             background: var(--card-bg); color: inherit; max-width: 100%; }

    /* 4. the chain: counted from history.txt */
    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
    .tile { padding: 12px 14px; border: 1px solid var(--card-border); border-radius: 10px; background: var(--card-bg); }
    .tile b { display: block; font-size: clamp(24px, 4vw, 34px); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .tile span { font-size: 13px; opacity: 0.7; }
    .bars { margin: 0; padding: 6px 0; list-style: none; }
    .bars li a { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 2.5em; align-items: center; gap: 10px; padding: 4px 12px;
                 color: inherit; text-decoration: none; font-size: 13px; }
    .bars li a:hover, .bars li a:focus-visible { background: rgba(127, 127, 127, 0.1); outline: none; }
    .bars .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bars .track { height: 10px; }
    .bars .fill { display: block; height: 100%; width: 0; border-radius: 0 4px 4px 0; background: var(--accent); transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .bars .n { text-align: right; font-variant-numeric: tabular-nums; opacity: 0.8; }
    .phases { margin: 0 0 14px; padding: 0; list-style: none; }
    .phases li { position: relative; margin: 0; padding: 0 0 14px 22px; border-left: 2px solid var(--card-border); margin-left: 6px; }
    .phases li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
    .phases b { display: block; }

    /* 5. the run in numbers: the timeline graphic (agents-timeline.svg, dark in every skin) */
    .timeline { display: block; background: #12162a; }
    .timeline img { display: block; width: 100%; height: auto; }
    .usage { margin: 0; padding: 0; list-style: none; font-size: 14px; }
    .usage li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 12px; border-bottom: 1px solid var(--card-border); }
    .usage li:last-child { border-bottom: 0; }
    .usage b { font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* the end */
    .finale { padding: 64px 0 0; border-top: 1px solid var(--card-border); text-align: center; }
    .finale h2 { margin: 0 0 10px; font-size: clamp(26px, 5vw, 40px); letter-spacing: -0.01em; }
    .finale p { margin: 0 auto 22px; max-width: 34em; opacity: 0.85; }
    .finale .go { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .finale .btn { padding: 10px 22px; font-size: 16px; border-radius: 999px; }

    /* skins: Arcade glows, Classic squares off */
    :root[data-skin="arcade"] .hero h1, :root[data-skin="arcade"] .finale h2 { color: #7df9ff; text-shadow: 0 0 18px rgba(125, 249, 255, 0.45); }
    :root[data-skin="arcade"] .panel { box-shadow: 0 0 0 1px rgba(255, 43, 214, 0.35), 0 0 28px rgba(255, 43, 214, 0.18); }
    :root[data-skin="classic"] .panel, :root[data-skin="classic"] .tile, :root[data-skin="classic"] .chapters a,
    :root[data-skin="classic"] .apps20 a { border-radius: 0; box-shadow: none; }

    @media (max-width: 760px) {
      section.chapter { grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 40px 0; }
      .hero { padding-top: 36px; }
      .story-top nav { display: none; }
      .tiles { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .tiles .tile:last-child { grid-column: 1 / -1; }
      .bars li a { grid-template-columns: 7.5em minmax(0, 1fr) 2.2em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bars .fill, .code .id { transition: none; }
    }
  </style>
</head>
<body>
<div id="root" style="display: contents"></div>
<script type="module" src="./src/story/main.tsx"></script>
</body>
</html>
